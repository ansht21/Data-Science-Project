# Car Price Prediction - Model Parameters

# Data parameters
data:
  raw_path: "data/raw/car_data.csv"
  processed_path: "data/processed/"
  target_column: "Selling_Price"
  test_size: 0.2
  random_state: 42

# Preprocessing parameters
preprocessing:
  numeric_features:
    - "Year"
    - "Present_Price"
    - "Driven_kms"
  categorical_features:
    - "Fuel_Type"
    - "Selling_type"
    - "Transmission"
    - "Owner"

# Model parameters
model:
  type: "random_forest"
  n_estimators: 100
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  max_features: "sqrt"
  bootstrap: true
  random_state: 42
  n_jobs: -1

# Training parameters
training:
  validation_split: 0.1
  shuffle: true

# Evaluation parameters
evaluation:
  metrics:
    - "mse"
    - "mae"
    - "rmse"
    - "r2"

# Output parameters
output:
  model_path: "models/car_price_model.pkl"
  save_preprocessed: true
